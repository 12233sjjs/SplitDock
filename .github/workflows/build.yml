name: Build SplitDock

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid

      - name: Install RootHide Theos and iOS SDK
        shell: bash
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            | tar -xJ -C "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

       name: Build package
        working-directory: ./SplitDock
        run: make clean package

      - uses: actions/upload-artifact@v4
        with:
          name: SplitDock-deb
          path: SplitDock/packages/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SplitDock-deb
          path: packages/*.deb
          if-no-files-found: error
